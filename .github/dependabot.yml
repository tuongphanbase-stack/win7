# Dependabot checks for outdated and vulnerable dependencies and opens
# a pull request to update them. Updates are grouped to keep PRs few.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    # Major upgrades (vite 2 -> 8, eslint 7 -> 10, ...) break the build and
    # the lint config and need a manual migration, so only offer minor and
    # patch updates here.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns: ["*"]
